<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pore Salon Simulator — Privacy Policy</title>
<script>
  // 브라우저 언어에 맞는 문서로 보낸다. 맞는 언어가 없으면 영어.
  (function () {
    var available = ['ko', 'en'];
    var langs = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i]).toLowerCase().split(/[-_]/)[0];
      if (available.indexOf(code) !== -1) { location.replace('privacy-policy-' + code); return; }
    }
    location.replace('privacy-policy-en');
  })();
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px">
<p>Privacy Policy</p>
<ul><li><a href="privacy-policy-ko">한국어</a></li><li><a href="privacy-policy-en">English</a></li></ul>
</body>
</html>
